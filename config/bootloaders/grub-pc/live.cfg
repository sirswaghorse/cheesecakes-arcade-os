# Cheesecake OS boot menu — live system + target-drive installer.

menuentry "Cheesecake OS (Live)" {
	linux	/live/vmlinuz boot=live components quiet splash
	initrd	/live/initrd.img
}

menuentry "Install Cheesecake OS to Internal Drive" {
	linux	/live/vmlinuz boot=live components quiet splash cheesecake-install
	initrd	/live/initrd.img
}

menuentry "Cheesecake OS (Live, fail-safe mode)" {
	linux	/live/vmlinuz boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp vga=normal
	initrd	/live/initrd.img
}

name: Build Cheesecake OS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm
      options: --privileged
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build debootstrap squashfs-tools xorriso curl ca-certificates git debian-archive-keyring
      - uses: actions/checkout@v4
      - name: Build image
        run: bash ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cheesecake-os-iso
          path: out/*.iso
          retention-days: 1
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso

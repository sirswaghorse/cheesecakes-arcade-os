name: Build Cheesecake OS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debian-archive-keyring debootstrap squashfs-tools xorriso curl
      - name: Build image
        run: sudo bash ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cheesecake-os-iso
          path: out/*.iso
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
